<div class="dfc-container">
    <div class="card-container front-face">
        <img class="card-image front-image">
        <div style="display: none;">{{cloze:Text}}</div>
        {{#c1}}<canvas id="front-rules" class="occlusion"></canvas>{{/c1}}
    </div>
    <div class="card-container back-face">
        <img class="card-image back-image">
        {{#c2}}<canvas id="back-rules" class="occlusion"></canvas>{{/c2}}
    </div>
</div>

<script>
var url = 'https://api.scryfall.com/cards/' + "{{UUID}}" + '?format=json';

fetch(url)
    .then(response => response.json())
    .then(data => {
        createCard(data);
    })
    .catch(error => {
        console.error('Error:', error);
    });

function createCard(data) {
    setCardImages(data);
    setOcclusions(data);
}

function setCardImages(data) {
    if (data.card_faces && data.card_faces.length >= 2) {
        document.querySelector('.front-image').src = data.card_faces[0].image_uris.normal;
        document.querySelector('.back-image').src = data.card_faces[1].image_uris.normal;
    }
}

function setOcclusions(data) {
    if (!data.card_faces || data.card_faces.length < 2) return;

    const canvases = getCanvases();
    const canvasContexts = getCanvasContexts(canvases);

    // Front face
    if (canvasContexts.frontRules) {
        const frontFillStyle = getFillStyle(canvasContexts.frontRules, data.card_faces[0]);
        canvasContexts.frontRules.fillStyle = frontFillStyle;
        setRulesOcclusion(canvasContexts.frontRules, data.card_faces[0].type_line);
    }

    // Back face
    if (canvasContexts.backRules) {
        const backFillStyle = getFillStyle(canvasContexts.backRules, data.card_faces[1]);
        canvasContexts.backRules.fillStyle = backFillStyle;
        setRulesOcclusion(canvasContexts.backRules, data.card_faces[1].type_line);
    }
}

function sortColorsByGuildOrder(colors) {
    // Official guild order for two-color pairs
    const guildOrder = [
        'WU', 'WB', 'RW', 'GW',  // Allied with W
        'UB', 'UR', 'GU',        // Allied with U (excluding W)
        'BR', 'BG',              // Allied with B (excluding W, U)
        'RG'                     // Allied with R (excluding W, U, B)
    ];

    if (colors.length !== 2) {
        return colors;
    }

    // Try both orderings and find which matches the guild order
    const pair1 = colors[0] + colors[1];
    const pair2 = colors[1] + colors[0];

    if (guildOrder.includes(pair1)) {
        return [colors[0], colors[1]];
    } else if (guildOrder.includes(pair2)) {
        return [colors[1], colors[0]];
    }

    // Fallback to original order if not found
    return colors;
}

function getOcclusionRectangle(typeLine) {
    // Check if it's a saga by looking at the type line
    if (typeLine && typeLine.includes('Saga')) {
        return { x: 14, y: 17, width: 134, height: 109 };
    } else {
        return { x: 24, y: 95, width: 250, height: 43 };
    }
}

function getFillStyle(context, cardFace) {
    const rect = getOcclusionRectangle(cardFace.type_line);
    const colors = cardFace.colors || cardFace.color_indicator || [];

    if (colors.length === 2) {
        const sortedColors = sortColorsByGuildOrder(colors);
        const gradient = context.createLinearGradient(rect.x, 0, rect.x + rect.width, 0);
        gradient.addColorStop(0, getMtgColor(sortedColors[0]));
        gradient.addColorStop(0.45, getMtgColor(sortedColors[0]));
        gradient.addColorStop(0.55, getMtgColor(sortedColors[1]));
        gradient.addColorStop(1, getMtgColor(sortedColors[1]));

        return gradient;
    } else {
        return getBackgroundColor(colors);
    }
}

function setRulesOcclusion(context, typeLine) {
    if (context) {
        const rect = getOcclusionRectangle(typeLine);
        context.fillRect(rect.x, rect.y, rect.width, rect.height);
    }
}

function getCanvases() {
    return {
        "frontRules": document.getElementById('front-rules'),
        "backRules": document.getElementById('back-rules')
    }
}

function getCanvasContexts(canvases) {
    return {
        "frontRules": canvases.frontRules ? canvases.frontRules.getContext('2d') : null,
        "backRules": canvases.backRules ? canvases.backRules.getContext('2d') : null
    }
}

function getBackgroundColor(colors) {
    if (colors.length === 0 || colors.length === 1) {
        return getMtgColor(colors[0]);
    } else {
        // For 3+ colors, return gold for multi-color cards
        return 'rgb(218, 165, 32)'; // Gold color for multi-color cards
    }
}

function getMtgColor(color_identity) {
    let background_color;

    switch (color_identity) {
        case 'W':
            background_color = 'rgb(248, 231, 185)'; // Light yellow
            break;
        case 'U':
            background_color = 'rgb(179, 206, 234)'; // Light blue
            break;
        case 'B':
            background_color = 'rgb(166, 159, 157)'; // Dark gray
            break;
        case 'R':
            background_color = 'rgb(235, 159, 130)'; // Light red
            break;
        case 'G':
            background_color = 'rgb(166, 211, 182)'; // Light green
            break;
        default:
            background_color = 'rgb(201, 194, 186)'; // Light brown (for colorless/artifacts)
    }

    return background_color;
}
</script>
